<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTIVIEWER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0C0E;
    --surface: #17181C;
    --surface-2: #1D1F24;
    --line: #2A2C31;
    --text: #ECEDEF;
    --text-muted: #8B8E96;
    --tally: #E8394A;
    --cue: #F2A93B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  ::selection { background: var(--tally); color: #fff; }

  :focus-visible {
    outline: 2px solid var(--cue);
    outline-offset: 2px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* ---------- Header / control bar ---------- */

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: 4px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--tally);
    box-shadow: 0 0 8px var(--tally);
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .brand-dot.active { animation: pulse 1.6s ease-in-out infinite; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.14em;
    margin: 0;
    white-space: nowrap;
  }

  .brand span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .add-form {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1 1 420px;
  }

  .platform-toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .platform-toggle button {
    background: var(--surface-2);
    border: none;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    padding: 8px 12px;
    letter-spacing: 0.05em;
    transition: background 0.15s, color 0.15s;
  }

  .platform-toggle button.active {
    background: var(--tally);
    color: #fff;
  }

  .add-form input[type="text"] {
    flex: 1 1 180px;
    min-width: 140px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .add-form input[type="text"]::placeholder {
    color: var(--text-muted);
  }

  .btn-primary {
    background: var(--cue);
    border: none;
    color: #17181C;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 4px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-ghost.active { border-color: var(--cue); color: var(--cue); }

  .favorites-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    width: 100%;
    padding-top: 2px;
  }

  .favorites-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-right: 2px;
    flex-shrink: 0;
  }

  .fav-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 5px 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .fav-chip .fav-add {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 0;
  }

  .fav-chip .fav-remove {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 2px 4px;
    font-size: 11px;
    line-height: 1;
    border-radius: 50%;
  }

  .fav-chip .fav-remove:hover { color: var(--tally); }

  .hint {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding-left: 2px;
  }

  /* ---------- Grid ---------- */

  main {
    padding: 16px;
    min-height: calc(100vh - 64px);
  }

  #grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(1, 1fr);
    grid-auto-flow: dense;
    grid-auto-rows: var(--row-h, auto);
  }

  .tile {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #000;
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* UMD label bar — signature element */
  .umd {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    padding: 7px 10px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .umd-tally {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }

  .umd-tally.on {
    background: var(--tally);
    box-shadow: 0 0 6px var(--tally);
  }

  @media (prefers-reduced-motion: no-preference) {
    .umd-tally.on { animation: pulse 1.6s ease-in-out infinite; }
  }

  .umd-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    cursor: text;
  }

  .umd-label-edit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--cue);
    border-radius: 3px;
    padding: 2px 5px;
    flex: 1;
    min-width: 0;
  }

  .umd-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 2px 5px;
    flex-shrink: 0;
  }

  .umd-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    margin-left: auto;
  }

  .umd-actions button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 4px 5px;
    border-radius: 3px;
    font-size: 12px;
    line-height: 1;
  }

  .umd-actions button:hover {
    background: var(--line);
    color: var(--text);
  }

  .umd-actions button.fav-on {
    color: var(--cue);
  }

  /* ---------- Drag-to-reorder & hero (resize) ---------- */

  .tile.dragging {
    opacity: 0.4;
  }

  .tile.drag-over {
    outline: 2px dashed var(--cue);
    outline-offset: -2px;
  }

  .umd {
    cursor: grab;
  }

  .umd:active {
    cursor: grabbing;
  }

  /* .tile.hero column/row span is set inline via JS, computed from the
     actual measured column count, so it stays correct across breakpoints. */

  /* ---------- Empty state ---------- */

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 20px;
    border: 1px dashed var(--line);
    border-radius: 6px;
  }

  .empty p.lead {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    letter-spacing: 0.04em;
    color: var(--text);
    margin: 0 0 6px;
  }

  .empty p.sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin: 0;
  }

  /* ---------- Program mode (fullscreen) ---------- */

  body.program-mode main { padding: 0; }
  body.program-mode #grid { display: none; }

  #program-view {
    display: none;
    flex-direction: column;
    height: calc(100vh - 64px);
  }

  body.program-mode #program-view { display: flex; }

  #program-video {
    flex: 1;
    position: relative;
    background: #000;
    min-height: 0;
    display: flex;
  }

  #filmstrip {
    display: flex;
    gap: 6px;
    padding: 8px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    overflow-x: auto;
  }

  .fs-item {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .fs-item.on {
    border-color: var(--tally);
    color: var(--text);
  }

  .fs-item .umd-tally { width: 6px; height: 6px; }

  .fs-back {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--cue);
  }

  /* Column count is computed dynamically in JS (applyGridLayout) from both
     the stream count and available width, so no fixed breakpoint rules
     are needed here. */

</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot active" id="brandDot"></div>
    <div>
      <h1>MULTIVIEWER</h1>
    </div>
    <span id="streamCount">0 SOURCES</span>
  </div>

  <div class="add-form" id="addForm">
    <div class="platform-toggle">
      <button type="button" class="active" data-platform="twitch" id="btnTwitch">TWITCH</button>
      <button type="button" data-platform="youtube" id="btnYoutube">YOUTUBE</button>
    </div>
    <input type="text" id="channelInput" placeholder="channel name" autocomplete="off">
    <button type="button" class="btn-primary" id="addSourceBtn">Add source</button>
    <button type="button" class="btn-ghost" id="copyLink">Copy link</button>
    <button type="button" class="btn-ghost" id="autoRefreshToggle">Auto-refresh: off</button>
    <div class="hint" id="formHint">Twitch: just the channel name (e.g. "shroud")</div>
    <div class="hint" id="domainDebug" style="opacity:0.6;"></div>
    <div class="favorites-bar" id="favoritesBar"></div>
  </div>
</header>

<main>
  <div id="grid"></div>

  <div id="program-view">
    <div id="program-video"></div>
    <div id="filmstrip"></div>
  </div>
</main>

<script>
(function(){
  const grid = document.getElementById('grid');
  const addSourceBtn = document.getElementById('addSourceBtn');
  const channelInput = document.getElementById('channelInput');
  const btnTwitch = document.getElementById('btnTwitch');
  const btnYoutube = document.getElementById('btnYoutube');
  const formHint = document.getElementById('formHint');
  const streamCountEl = document.getElementById('streamCount');
  const copyLinkBtn = document.getElementById('copyLink');
  const autoRefreshToggle = document.getElementById('autoRefreshToggle');
  const favoritesBar = document.getElementById('favoritesBar');
  const programView = document.getElementById('program-view');
  const programVideo = document.getElementById('program-video');
  const filmstrip = document.getElementById('filmstrip');
  const brandDot = document.getElementById('brandDot');

  let platform = 'twitch';
  let streams = []; // { id, platform, ident, label }
  let programId = null;
  let uidCounter = 0;
  let heroKey = null; // "platform:ident" of the enlarged tile, or null
  let favorites = []; // { platform, ident, ytType, label }
  let autoRefreshEnabled = false;
  let autoRefreshTimer = null;
  const AUTO_REFRESH_MS = 30 * 60 * 1000; // 30 minutes

  const parentHost = window.location.hostname || 'example.com';
  document.getElementById('domainDebug').textContent = 'Embed domain detected: ' + (window.location.hostname || '(none — this is why embeds are blocked)');

  btnTwitch.addEventListener('click', () => setPlatform('twitch'));
  btnYoutube.addEventListener('click', () => setPlatform('youtube'));

  function setPlatform(p) {
    platform = p;
    btnTwitch.classList.toggle('active', p === 'twitch');
    btnYoutube.classList.toggle('active', p === 'youtube');
    formHint.textContent = p === 'twitch'
      ? 'Twitch: just the channel name (e.g. "shroud")'
      : 'YouTube: any watch URL or video ID works (live or not). Use a channel ID (starts with UC) to follow its live stream.';
    channelInput.placeholder = p === 'twitch' ? 'channel name' : 'video ID, URL, or channel ID';
  }

  function extractYoutubeId(raw) {
    raw = raw.trim();
    // pull a start-time param if present (supports t=90, t=90s, start=90)
    let startSeconds = null;
    const timeMatch = raw.match(/[?&](?:t|start)=([0-9]+)s?/);
    if (timeMatch) startSeconds = parseInt(timeMatch[1], 10);

    // full URL forms
    const watchMatch = raw.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{6,})/);
    if (watchMatch) return { type: 'video', id: watchMatch[1], start: startSeconds };
    if (raw.startsWith('UC') && raw.length > 10) return { type: 'channel', id: raw, start: null };
    // bare video id heuristic
    if (/^[a-zA-Z0-9_-]{6,}$/.test(raw)) return { type: 'video', id: raw, start: startSeconds };
    return null;
  }

  function streamKey(stream) {
    return stream.platform + ':' + stream.ident;
  }

  function buildEmbedSrc(stream) {
    if (stream.platform === 'twitch') {
      return `https://player.twitch.tv/?channel=${encodeURIComponent(stream.ident)}&parent=${parentHost}&muted=true`;
    } else {
      if (stream.ytType === 'channel') {
        return `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(stream.ident)}&autoplay=1&mute=1`;
      }
      const startParam = stream.ytStart ? `&start=${stream.ytStart}` : '';
      return `https://www.youtube.com/embed/${encodeURIComponent(stream.ident)}?autoplay=1&mute=1${startParam}`;
    }
  }

  function buildEmbedSrcFresh(stream) {
    return buildEmbedSrc(stream) + '&_cb=' + Date.now();
  }

  function addSource() {
    const raw = channelInput.value.trim();
    if (!raw) return;

    let stream = null;
    if (platform === 'twitch') {
      stream = {
        uid: 'u' + (uidCounter++),
        platform: 'twitch',
        ident: raw.replace(/^\/+/, ''),
        ytType: null,
        label: raw
      };
    } else {
      const parsed = extractYoutubeId(raw);
      if (!parsed) {
        formHint.textContent = 'Could not parse that — try a video ID, watch URL, or channel ID (UC...)';
        return;
      }
      stream = {
        uid: 'u' + (uidCounter++),
        platform: 'youtube',
        ident: parsed.id,
        ytType: parsed.type,
        ytStart: parsed.start,
        label: parsed.type === 'channel' ? parsed.id + ' (live)' : parsed.id
      };
    }

    streams.push(stream);
    channelInput.value = '';
    saveToStorage();
    appendTileForStream(stream);
  }

  addSourceBtn.addEventListener('click', addSource);
  channelInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addSource();
  });

  autoRefreshToggle.addEventListener('click', () => {
    autoRefreshEnabled = !autoRefreshEnabled;
    saveAutoRefreshSetting();
    applyAutoRefreshTimer();
  });

  copyLinkBtn.addEventListener('click', () => {
    const payload = streams.map(s => `${s.platform}:${s.ident}${s.ytType === 'channel' ? ':ch' : ''}`).join(',');
    const url = window.location.origin + window.location.pathname + (payload ? ('?sources=' + encodeURIComponent(payload)) : '');
    navigator.clipboard.writeText(url).then(() => {
      copyLinkBtn.textContent = 'Copied';
      setTimeout(() => copyLinkBtn.textContent = 'Copy link', 1400);
    }).catch(() => {
      copyLinkBtn.textContent = 'Copy failed';
      setTimeout(() => copyLinkBtn.textContent = 'Copy link', 1400);
    });
  });

  const STORAGE_KEY = 'multiviewer-streams-v1';

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(streams.map(s => ({
        platform: s.platform, ident: s.ident, ytType: s.ytType, ytStart: s.ytStart, label: s.label
      }))));
    } catch (e) { /* storage unavailable, fail silently */ }
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) return false;
      parsed.forEach(s => {
        streams.push({
          uid: 'u' + (uidCounter++),
          platform: s.platform,
          ident: s.ident,
          ytType: s.ytType || null,
          ytStart: s.ytStart || null,
          label: s.label
        });
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const sources = params.get('sources');
    if (!sources) return;
    sources.split(',').forEach(entry => {
      const parts = entry.split(':');
      if (parts.length < 2) return;
      const [plat, ident, tag] = parts;
      streams.push({
        uid: 'u' + (uidCounter++),
        platform: plat,
        ident: ident,
        ytType: tag === 'ch' ? 'channel' : null,
        label: plat === 'youtube' && tag === 'ch' ? ident + ' (live)' : ident
      });
    });
  }

  const FAVORITES_KEY = 'multiviewer-favorites-v1';
  const AUTOREFRESH_KEY = 'multiviewer-autorefresh-v1';
  const HERO_KEY = 'multiviewer-hero-v1';

  function saveFavorites() {
    try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites)); } catch (e) {}
  }

  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAVORITES_KEY);
      favorites = raw ? JSON.parse(raw) : [];
    } catch (e) { favorites = []; }
  }

  function isFavorited(stream) {
    return favorites.some(f => f.platform === stream.platform && f.ident === stream.ident);
  }

  function toggleFavorite(stream, btnEl) {
    if (isFavorited(stream)) {
      favorites = favorites.filter(f => !(f.platform === stream.platform && f.ident === stream.ident));
    } else {
      favorites.push({
        platform: stream.platform, ident: stream.ident,
        ytType: stream.ytType || null, label: stream.label
      });
    }
    saveFavorites();
    renderFavorites();
    // Patch just this tile's star icon rather than calling render(), which
    // would rebuild every tile and reload every iframe.
    if (btnEl) {
      const on = isFavorited(stream);
      btnEl.textContent = on ? '★' : '☆';
      btnEl.className = on ? 'fav-on' : '';
    }
  }

  function addFromFavorite(fav) {
    const stream = {
      uid: 'u' + (uidCounter++),
      platform: fav.platform,
      ident: fav.ident,
      ytType: fav.ytType || null,
      ytStart: null,
      label: fav.label
    };
    streams.push(stream);
    saveToStorage();
    appendTileForStream(stream);
  }

  function startRename(stream, labelEl, umdEl) {
    // Dragging is keyed off the umd bar; disable it while typing so a
    // click-and-drag inside the text field doesn't get mistaken for a
    // reorder gesture.
    umdEl.draggable = false;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'umd-label-edit';
    input.value = stream.label;
    labelEl.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      stream.label = val || stream.label;
      saveToStorage();
      labelEl.textContent = stream.label;
      input.replaceWith(labelEl);
      umdEl.draggable = true;

      // Keep the favorites chip in sync — it stores its own snapshot of
      // the label from whenever it was starred, so update it here rather
      // than leaving it stale.
      const fav = favorites.find(f => f.platform === stream.platform && f.ident === stream.ident);
      if (fav) {
        fav.label = stream.label;
        saveFavorites();
        renderFavorites();
      }
    }

    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      else if (e.key === 'Escape') { input.value = stream.label; input.blur(); }
    });
    input.addEventListener('blur', commit);
  }

  function updateFavButtonsFor(platform, ident) {
    streams
      .filter(s => s.platform === platform && s.ident === ident)
      .forEach(s => {
        const tileEl = grid.querySelector('.tile[data-uid="' + s.uid + '"]');
        if (!tileEl) return;
        const btn = tileEl.querySelector('button[title="Save as favorite"]');
        if (!btn) return;
        const on = isFavorited(s);
        btn.textContent = on ? '★' : '☆';
        btn.className = on ? 'fav-on' : '';
      });
  }

  function renderFavorites() {
    favoritesBar.innerHTML = '';
    if (favorites.length === 0) return;

    const label = document.createElement('span');
    label.className = 'favorites-label';
    label.textContent = 'FAVORITES';
    favoritesBar.appendChild(label);

    favorites.forEach(fav => {
      const chip = document.createElement('span');
      chip.className = 'fav-chip';

      const addBtn = document.createElement('button');
      addBtn.className = 'fav-add';
      addBtn.textContent = (fav.platform === 'twitch' ? 'TW ' : 'YT ') + fav.label;
      addBtn.title = 'Add to wall';
      addBtn.addEventListener('click', () => addFromFavorite(fav));
      chip.appendChild(addBtn);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'fav-remove';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove favorite';
      removeBtn.addEventListener('click', () => {
        favorites = favorites.filter(f => f !== fav);
        saveFavorites();
        renderFavorites();
        updateFavButtonsFor(fav.platform, fav.ident);
      });
      chip.appendChild(removeBtn);

      favoritesBar.appendChild(chip);
    });
  }

  function saveAutoRefreshSetting() {
    try { localStorage.setItem(AUTOREFRESH_KEY, autoRefreshEnabled ? '1' : '0'); } catch (e) {}
  }

  function loadAutoRefreshSetting() {
    try { autoRefreshEnabled = localStorage.getItem(AUTOREFRESH_KEY) === '1'; } catch (e) { autoRefreshEnabled = false; }
  }

  function applyAutoRefreshTimer() {
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    autoRefreshToggle.textContent = 'Auto-refresh: ' + (autoRefreshEnabled ? 'on (30m)' : 'off');
    autoRefreshToggle.classList.toggle('active', autoRefreshEnabled);
    if (autoRefreshEnabled) {
      autoRefreshTimer = setInterval(refreshAllTiles, AUTO_REFRESH_MS);
    }
  }

  function refreshTile(stream) {
    const tileEl = grid.querySelector(`.tile[data-uid="${stream.uid}"] iframe`);
    if (tileEl) tileEl.src = buildEmbedSrcFresh(stream);
    if (programId === stream.uid) {
      const progFrame = programVideo.querySelector('iframe');
      if (progFrame) progFrame.src = buildEmbedSrcFresh(stream);
    }
  }

  function refreshAllTiles() {
    streams.forEach(refreshTile);
  }

  function saveHero() {
    try {
      if (heroKey) localStorage.setItem(HERO_KEY, heroKey);
      else localStorage.removeItem(HERO_KEY);
    } catch (e) {}
  }

  function loadHero() {
    try { heroKey = localStorage.getItem(HERO_KEY) || null; } catch (e) { heroKey = null; }
  }

  function reorderStreams(draggedUid, targetUid) {
    if (draggedUid === targetUid) return;
    const draggedEl = grid.querySelector('.tile[data-uid="' + draggedUid + '"]');
    const targetEl = grid.querySelector('.tile[data-uid="' + targetUid + '"]');
    if (!draggedEl || !targetEl) return;

    // Move the existing DOM node rather than calling render() — a full
    // render() rebuilds every tile from scratch, which reloads every
    // iframe. Reordering is just a position change.
    grid.insertBefore(draggedEl, targetEl);

    // Re-derive the streams array order from the new DOM order so saved
    // state stays in sync with what's on screen.
    const newOrder = Array.from(grid.querySelectorAll('.tile')).map(el => el.dataset.uid);
    streams.sort((a, b) => newOrder.indexOf(a.uid) - newOrder.indexOf(b.uid));

    saveToStorage();
    applyGridLayout();
  }


  function removeStream(uid) {
    streams = streams.filter(s => s.uid !== uid);
    if (programId === uid) exitProgram();
    saveToStorage();

    // Remove just this tile's node rather than calling render() — a full
    // render() rebuilds every remaining tile, reloading every iframe.
    const tileEl = grid.querySelector('.tile[data-uid="' + uid + '"]');
    if (tileEl) tileEl.remove();

    streamCountEl.textContent = streams.length + (streams.length === 1 ? ' SOURCE' : ' SOURCES');
    brandDot.classList.toggle('active', streams.length > 0);

    if (streams.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `<p class="lead">No sources on the wall yet</p><p class="sub">Add a Twitch channel or YouTube stream above to bring up a monitor.</p>`;
      grid.appendChild(empty);
      return;
    }

    applyGridLayout();
  }

  function moveWrapToProgram(uid) {
    const wrap = grid.querySelector('.video-wrap[data-uid="' + uid + '"]');
    if (wrap) programVideo.appendChild(wrap);
  }

  function moveWrapBackToGrid(uid) {
    const wrap = programVideo.querySelector('.video-wrap[data-uid="' + uid + '"]');
    const tile = grid.querySelector('.tile[data-uid="' + uid + '"]');
    if (wrap && tile) tile.prepend(wrap);
  }

  function enterProgram(uid) {
    if (!streams.some(s => s.uid === uid)) return;
    // Moving the real video-wrap node (rather than building a new iframe)
    // means the same player instance keeps running — no reload on entering
    // fullscreen, returning to grid, or switching between streams here.
    if (programId && programId !== uid) {
      moveWrapBackToGrid(programId);
    }
    programId = uid;
    document.body.classList.add('program-mode');
    moveWrapToProgram(uid);
    renderFilmstrip();
  }

  function exitProgram() {
    if (programId) moveWrapBackToGrid(programId);
    programId = null;
    document.body.classList.remove('program-mode');
  }

  function renderFilmstrip() {
    filmstrip.innerHTML = '';
    const backBtn = document.createElement('button');
    backBtn.className = 'fs-back';
    backBtn.textContent = '⤢ Grid';
    backBtn.addEventListener('click', exitProgram);
    filmstrip.appendChild(backBtn);

    streams.forEach(s => {
      const item = document.createElement('button');
      item.className = 'fs-item' + (s.uid === programId ? ' on' : '');
      const dot = document.createElement('span');
      dot.className = 'umd-tally' + (s.uid === programId ? ' on' : '');
      item.appendChild(dot);
      const label = document.createElement('span');
      label.textContent = (s.platform === 'twitch' ? 'TW' : 'YT') + ' ' + s.label;
      item.appendChild(label);
      item.addEventListener('click', () => enterProgram(s.uid));
      filmstrip.appendChild(item);
    });
  }

  // Minimum comfortable tile width before we'd rather wrap to more rows
  // than shrink columns further.
  const MIN_TILE_WIDTH = 240;

  function idealColumnsForCount(n) {
    if (n <= 1) return 1;
    if (n === 2) return 2;
    if (n <= 4) return 3;          // 3-4 streams: fill a single row of 3
    return Math.ceil(n / 2);       // 5+: fill 2 rows fully before growing columns
  }

  function maxColumnsForWidth(width) {
    return Math.max(1, Math.floor(width / MIN_TILE_WIDTH));
  }

  function buildTile(stream) {
    const tile = document.createElement('div');
    tile.className = 'tile' + (heroKey === streamKey(stream) ? ' hero' : '');
    tile.dataset.uid = stream.uid;

    tile.addEventListener('dragover', (e) => {
      e.preventDefault();
      tile.classList.add('drag-over');
    });
    tile.addEventListener('dragleave', () => tile.classList.remove('drag-over'));
    tile.addEventListener('drop', (e) => {
      e.preventDefault();
      tile.classList.remove('drag-over');
      const draggedUid = e.dataTransfer.getData('text/plain');
      reorderStreams(draggedUid, stream.uid);
    });

    const wrap = document.createElement('div');
    wrap.className = 'video-wrap';
    wrap.dataset.uid = stream.uid;
    const iframe = document.createElement('iframe');
    iframe.src = buildEmbedSrc(stream);
    iframe.allow = 'autoplay; fullscreen';
    iframe.allowFullscreen = true;
    wrap.appendChild(iframe);
    tile.appendChild(wrap);

    const umd = document.createElement('div');
    umd.className = 'umd';
    umd.draggable = true;
    umd.title = 'Drag to reorder';
    umd.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', stream.uid);
      tile.classList.add('dragging');
    });
    umd.addEventListener('dragend', () => {
      tile.classList.remove('dragging');
      grid.querySelectorAll('.tile').forEach(t => t.classList.remove('drag-over'));
    });

    const tally = document.createElement('span');
    tally.className = 'umd-tally';
    umd.appendChild(tally);

    const badge = document.createElement('span');
    badge.className = 'umd-badge';
    badge.textContent = stream.platform === 'twitch' ? 'TW' : 'YT';
    umd.appendChild(badge);

    const label = document.createElement('span');
    label.className = 'umd-label';
    label.textContent = stream.label;
    label.title = 'Click to rename';
    label.addEventListener('click', (e) => {
      e.stopPropagation();
      startRename(stream, label, umd);
    });
    umd.appendChild(label);

    const actions = document.createElement('div');
    actions.className = 'umd-actions';

    const heroBtn = document.createElement('button');
    heroBtn.textContent = '◱';
    heroBtn.title = 'Make this the hero tile (double width)';
    heroBtn.addEventListener('click', () => {
      const newKey = (heroKey === streamKey(stream)) ? null : streamKey(stream);
      heroKey = newKey;
      saveHero();
      // Toggle the class directly rather than calling render() — a full
      // render() rebuilds every tile from scratch, which reloads every
      // iframe. Hero is just a layout change, so patch the DOM in place.
      grid.querySelectorAll('.tile.hero').forEach(t => t.classList.remove('hero'));
      if (newKey) tile.classList.add('hero');
      applyGridLayout();
    });
    actions.appendChild(heroBtn);

    const refreshBtn = document.createElement('button');
    refreshBtn.textContent = '↻';
    refreshBtn.title = 'Refresh this stream';
    refreshBtn.addEventListener('click', () => refreshTile(stream));
    actions.appendChild(refreshBtn);

    const favBtn = document.createElement('button');
    favBtn.textContent = isFavorited(stream) ? '★' : '☆';
    favBtn.className = isFavorited(stream) ? 'fav-on' : '';
    favBtn.title = 'Save as favorite';
    favBtn.addEventListener('click', () => toggleFavorite(stream, favBtn));
    actions.appendChild(favBtn);

    const expandBtn = document.createElement('button');
    expandBtn.textContent = '⤢';
    expandBtn.title = 'Punch to program (fullscreen)';
    expandBtn.addEventListener('click', () => enterProgram(stream.uid));
    actions.appendChild(expandBtn);

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove source';
    removeBtn.addEventListener('click', () => removeStream(stream.uid));
    actions.appendChild(removeBtn);

    umd.appendChild(actions);
    tile.appendChild(umd);
    return tile;
  }

  function render() {
    streamCountEl.textContent = streams.length + (streams.length === 1 ? ' SOURCE' : ' SOURCES');
    brandDot.classList.toggle('active', streams.length > 0);

    grid.innerHTML = '';

    if (streams.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `<p class="lead">No sources on the wall yet</p><p class="sub">Add a Twitch channel or YouTube stream above to bring up a monitor.</p>`;
      grid.appendChild(empty);
      return;
    }

    streams.forEach(stream => grid.appendChild(buildTile(stream)));

    applyGridLayout();
  }

  function appendTileForStream(stream) {
    // Adds exactly one new tile without touching any existing tile/iframe —
    // used when a source is added so the rest of the wall keeps playing.
    streamCountEl.textContent = streams.length + (streams.length === 1 ? ' SOURCE' : ' SOURCES');
    brandDot.classList.toggle('active', true);

    const emptyEl = grid.querySelector('.empty');
    if (emptyEl) emptyEl.remove();

    grid.appendChild(buildTile(stream));
    applyGridLayout();
  }

  function applyGridLayout() {
    // Clear any previous inline span overrides on every tile first — if we
    // only cleared the one currently found via .tile.hero, a tile that was
    // just toggled OFF (class already removed) would keep its old inline
    // grid-column/grid-row and stay visually enlarged.
    grid.querySelectorAll('.tile').forEach(t => {
      t.style.gridColumn = '';
      t.style.gridRow = '';
    });

    const n = streams.length;
    if (n === 0) return;

    const gridWidth = grid.clientWidth || window.innerWidth;
    const colCount = Math.min(idealColumnsForCount(n), maxColumnsForWidth(gridWidth));
    grid.style.gridTemplateColumns = `repeat(${colCount}, 1fr)`;

    const gapPx = parseFloat(getComputedStyle(grid).gap) || 10;
    const colWidth = (gridWidth - gapPx * (colCount - 1)) / colCount;

    const sampleUmd = grid.querySelector('.umd');
    const umdHeight = sampleUmd ? sampleUmd.offsetHeight : 40;

    const rowHeight = Math.round(colWidth * 9 / 16) + umdHeight;
    grid.style.setProperty('--row-h', rowHeight + 'px');

    const heroEl = grid.querySelector('.tile.hero');
    if (heroEl) {
      const span = colCount >= 2 ? 2 : 1;
      heroEl.style.gridColumn = 'span ' + span;
      heroEl.style.gridRow = 'span ' + span;
    }
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyGridLayout, 150);
  });

  loadFavorites();
  renderFavorites();
  loadHero();
  loadAutoRefreshSetting();
  applyAutoRefreshTimer();

  const params = new URLSearchParams(window.location.search);
  if (params.get('sources')) {
    loadFromUrl();
    saveToStorage();
  } else {
    loadFromStorage();
  }
  render();
})();
</script>

</body>
</html>
